  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6c757d"/><stop offset="45%" stop-color="#f8f9fa"/><stop offset="100%" stop-color="#343a40"/>
  </linearGradient>
  <radialGradient id="ground" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7a1636" stop-opacity="0.45"/><stop offset="100%" stop-color="#7a1636" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dot" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ffd6e5"/><stop offset="50%" stop-color="#e64980"/><stop offset="100%" stop-color="#8c1d47"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="6" dy="16" stdDeviation="12" flood-color="#5c0f2e" flood-opacity="0.4"/>
  </filter>
  <filter id="dropSm" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="3" dy="7" stdDeviation="5" flood-color="#5c0f2e" flood-opacity="0.35"/>
  </filter>
  <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

