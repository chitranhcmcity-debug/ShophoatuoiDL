<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="bvPetal" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
  <feDiffuseLighting in="b" surfaceScale="7" diffuseConstant="1" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
  <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.45" result="shade"/>
  <feSpecularLighting in="b" surfaceScale="7" specularConstant="0.5" specularExponent="18" lighting-color="#fff" result="s"><fePointLight x="150" y="40" z="260"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="shade" in2="SourceAlpha" operator="in" result="shade2"/>
  <feComposite in="shade2" in2="s2" operator="arithmetic" k2="1" k3="1"/>
</filter>
<filter id="bvBack" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
  <feDiffuseLighting in="b" surfaceScale="7" diffuseConstant="1" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
  <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.35" result="shade"/>
  <feSpecularLighting in="b" surfaceScale="7" specularConstant="0.3" specularExponent="18" lighting-color="#fff" result="s"><fePointLight x="150" y="40" z="260"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="shade" in2="SourceAlpha" operator="in" result="shade2"/>
  <feComposite in="shade2" in2="s2" operator="arithmetic" k2="1" k3="1"/>
</filter>
<filter id="bvFace" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b"/>
