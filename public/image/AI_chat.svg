  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="shade" in2="SourceAlpha" operator="in" result="shade2"/>
  <feComposite in="shade2" in2="s2" operator="arithmetic" k2="1" k3="1"/>
</filter>
<filter id="bvLeaf" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
