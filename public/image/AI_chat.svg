  <radialGradient id="bg" cx="50%" cy="35%" r="70%">
    <stop offset="0%" stop-color="#fff8fb"/><stop offset="65%" stop-color="#ffd3e4"/><stop offset="100%" stop-color="#f08cb3"/>
