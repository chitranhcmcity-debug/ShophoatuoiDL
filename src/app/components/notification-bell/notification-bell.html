<div class="bell-wrap">
  <button class="bell-btn" type="button" title="Thông báo" (click)="toggle()">
    <i class="bi bi-bell-fill fs-5"></i>
    @if (notificationService.inbox().length > 0) {
    <span class="bell-badge">{{ notificationService.inbox().length > 99 ? '99+' : notificationService.inbox().length }}</span>
    }
  </button>

  @if (open()) {
  <div class="bell-backdrop" (click)="close()"></div>
  <div class="bell-panel">
    <div class="bell-head">
      <b>Thông báo hôm nay</b>
      @if (notificationService.inbox().length > 0) {
      <a href="javascript:void(0)" (click)="notificationService.markAllRead()">Đánh dấu đã đọc</a>
      }
    </div>
    <div class="bell-list">
      @for (n of notificationService.inbox(); track n.id) {
      <a href="javascript:void(0)" class="bell-item" (click)="view(n)">
        <i class="bi" [class]="'ico ' + n.tone + ' ' + icons[n.tone]"></i>
        <div>
          <b>{{ n.title }}</b>
          <p>{{ n.message }}</p>
          <small>{{ n.time | date: 'HH:mm dd/MM/yyyy' }}</small>
        </div>
      </a>
      } @empty {
      <div class="bell-empty">Không có thông báo mới</div>
      }
    </div>
    <a href="javascript:void(0)" class="bell-foot" (click)="openHistory()">
      <i class="bi bi-clock-history"></i> Xem lịch sử thông báo
    </a>
  </div>
  }
</div>
